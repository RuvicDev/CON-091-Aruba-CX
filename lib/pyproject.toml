[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-aruba-cx-connector"
version = "1.0.0"
description = "Consulta de switches HPE Aruba CX (AOS-CX REST API): información del switch, interfaces, VLANs y estado de puertos. Solo lectura"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_aruba_cx_connector*"]
